# ==============================================================
# nginx.conf — Production frontend
# - Serve SPA (fallback para index.html)
# - Proxy reverso /api/ → Django (Gunicorn)
# - Cache agressivo para assets com hash
# - Gzip comprimido
# - Headers de seguranca
# ==============================================================

upstream django {
server web:8000; # nome do servico no docker-compose
}

server {
listen 80;
server_name _;
root /usr/share/nginx/html;
index index.html;

# ── Security headers ──────────────────────────────────
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ── Gzip ──────────────────────────────────────────────
gzip on;
gzip_comp_level 6;
gzip_vary on;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;

# ── Assets com hash → cache maximo ────────────────────
location /assets/ {
expires 1y;
add_header Cache-Control "public, immutable";
access_log off;
}

# ── Proxy API → Django ────────────────────────────────
location /api/ {
proxy_pass http://django;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
proxy_redirect off;
}

# ── Admin Django ──────────────────────────────────────
location /admin/ {
proxy_pass http://django;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Media / Static files (se o Django servir) ────────
location /static/ {
alias /app/staticfiles/;
expires 1y;
add_header Cache-Control "public, immutable";
}

# ── SPA fallback ──────────────────────────────────────
location / {
try_files $uri $uri/ /index.html;
add_header Cache-Control "no-cache, must-revalidate";
}
}
