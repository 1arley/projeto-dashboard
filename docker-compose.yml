# ============================================================
#  docker-compose.yml — Desenvolvimento (default)
#  Para produção: docker-compose -f docker-compose.prod.yml up
# ============================================================

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electricity_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-electricity_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/electricity/dashboard/kpis/')"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only-change-in-prod}
      - DB_NAME=${POSTGRES_DB:-electricity_db}
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_HOST=db
      - DB_PORT=5432

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json                      # se adicionares deps
      - ./frontend/.env.production:/app/.env.production:ro
      - frontend_node_modules:/app/node_modules                        # volume anónimo para não sobrescrever node_modules
    ports:
      - "5173:5173"
    depends_on:
      web:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - VITE_PROXY_TARGET=http://web:8000                              # proxy Vite → Django (hostname do Docker)
      - CHOKIDAR_USEPOLLING=true                                       # polling necessário para hot-reload em Docker (Linux/Mac)

volumes:
  postgres_data:
  frontend_node_modules:
